def includeBuildAndSubstituteDependencies(prefix,name) {
	if (file("$prefix/$name").exists()) {
		includeBuild("$prefix/$name") {
			dependencySubstitution {
				substitute module('fr.ensta-bretagne:$name') using project(':')
			}
		}
	} else {
		println("No file '../$prefix/$name'")
	}
}

